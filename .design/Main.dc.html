<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --ink: #241f1a;
      --paper: #faf6ee;
      --paper-raised: #f2ebdc;
      --muted: #8a7f6c;
      --rule: #e2d8c3;
      --accent: {{accent}};
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--ink); text-decoration: none; }
    a:hover .post-title { color: var(--accent); }
  </style>
</helmet>
<div style="background: var(--paper); min-height: 100%; font-family: 'Source Sans 3', system-ui, sans-serif; color: var(--ink);">

  <div style="max-width: 720px; margin: 0 auto; padding: 72px 24px 96px;">

    <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 40px; border-bottom: 1px solid var(--rule); margin-bottom: 48px;">
      <div style="font-family: 'Fraunces', Georgia, serif; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);">RSC Journal</div>
      <h1 style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 44px; line-height: 1.1; margin: 0;">RSC Demo Blog</h1>
      <p style="font-size: 17px; color: var(--muted); margin: 8px 0 0; max-width: 46ch;">Short notes on React Server Components — render on the server, ship less JS to the browser.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0;">
      <sc-for list="{{posts}}" as="post" hint-placeholder-count="3">
        <a href="{{post.href}}" style="display: block;">
          <div style="display: flex; flex-direction: column; gap: 10px; padding: 32px 0; border-bottom: 1px solid var(--rule);">
            <div style="font-size: 13px; letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase;">{{post.date}}</div>
            <div class="post-title" style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.25; transition: color 0.15s ease;">{{post.title}}</div>
            <div style="font-size: 16px; color: var(--muted); line-height: 1.6; max-width: 58ch;">{{post.excerpt}}</div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--accent); margin-top: 4px;">
              <span>Read more</span>
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
            </div>
          </div>
        </a>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{
  "accent": {"editor": "color", "default": "#b45309", "options": ["#b45309", "#2563eb", "#166534", "#9d174d"]}
}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? "#b45309",
      posts: [
        {
          href: "Detail.dc.html",
          date: "August 10, 2026",
          title: "Server Components run on the server",
          excerpt: "Learn why Server Components help shrink the JS sent to the browser."
        },
        {
          href: "#",
          date: "August 15, 2026",
          title: "Client Components run on both server and client",
          excerpt: "Client Components are still rendered on the server first, then hydrated on the client."
        },
        {
          href: "#",
          date: "August 20, 2026",
          title: "RSC helps shrink the JS sent to the browser",
          excerpt: "Only the Client Component parts need to ship JS to the browser — the rest doesn't."
        }
      ]
    };
  }
}
</script>
</body>
</html>
